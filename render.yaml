services:
  - type: web
    name: bmit-backend
    runtime: node
    repo: https://github.com/bluemantleinstitute-bot/bmit-backend
    branch: main
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STAFF_USERNAME
        sync: false
      - key: STAFF_PASSWORD_HASH
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: USER_APP_URL
        sync: false
